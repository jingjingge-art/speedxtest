<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a33">
  <title>网络测速（Cloudflare）</title>
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #f4f7ff;
      background: #0b1224;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 38px 16px;
      background: radial-gradient(ellipse at 50% 0, #1d3262 0, #0b1224 62%);
      text-align: center;
    }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 46px);
      border: 1px solid #ffffff1a;
      border-radius: 24px;
      background: #111b31ee;
      box-shadow: 0 24px 80px #0006;
    }
    .eyebrow { margin: 0 0 10px; color: #8ca9ff; font-size: .78rem; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    .intro { margin: 12px 0 26px; color: #aab6d0; line-height: 1.7; }
    #startBtn {
      min-width: 180px;
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #5b86ff, #7655ef);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 26px #526fff44;
      transition: transform .18s ease, filter .18s ease;
    }
    #startBtn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    #startBtn:disabled { cursor: wait; opacity: .7; }
    #status { min-height: 1.6em; margin: 18px 0 26px; color: #c1cbe0; }
    .results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .result {
      padding: 22px 12px;
      border: 1px solid #ffffff18;
      border-radius: 18px;
      background: linear-gradient(145deg, #1a2844, #141e34);
    }
    .result-label { display: block; margin-bottom: 12px; color: #b6c2da; }
    .result-value { color: #fff; font-size: clamp(2rem, 8vw, 3rem); font-variant-numeric: tabular-nums; font-weight: 750; }
    .result-unit { margin-left: 6px; color: #aab6d0; font-size: .95rem; }
    .conversion { display: block; margin-top: 8px; color: #93a2bf; font-size: .85rem; }
    .notice { margin: 22px 0 0; padding: 12px 14px; border: 1px solid #ffffff16; border-radius: 12px; color: #aab6d0; font-size: .82rem; line-height: 1.65; text-align: left; }
    .notice a { color: #9ab5ff; }
    @media (max-width: 480px) {
      body { padding: 18px 10px; }
      main { border-radius: 18px; }
      .results { gap: 10px; }
      .result { padding: 20px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">INTERNET SPEED TEST</p>
    <h1>网络测速</h1>
    <p class="intro">先测试下载 25 秒，再测试上传 15 秒</p>
    <button id="startBtn" type="button">开始测速</button>
    <div id="status" role="status" aria-live="polite">准备就绪</div>
    <section class="results" aria-label="测速结果">
      <article class="result">
        <span class="result-label">下载速度</span>
        <span id="download" class="result-value">—</span><span class="result-unit">Mbps</span>
        <span id="downloadBytes" class="conversion">约 — MB/s</span>
      </article>
      <article class="result">
        <span class="result-label">上传速度</span>
        <span id="upload" class="result-value">—</span><span class="result-unit">Mbps</span>
        <span id="uploadBytes" class="conversion">约 — MB/s</span>
      </article>
    </section>
    <p class="notice">
      下载与上传依次测试，速度按测试窗口内传输的数据量除以实际用时计算。测速请求发送到 Cloudflare 官方测速服务；请勿连续频繁运行。Cloudflare 的官方 SDK 会收集其 SDK 测试结果用于汇总分析；本页直接请求公开测速接口，不使用该 SDK。<br>
      <a href="https://github.com/cloudflare/speedtest" target="_blank" rel="noopener noreferrer">查看 Cloudflare Speedtest 说明</a>
    </p>
  </main>

  <script>
    (function () {
      var startButton = document.getElementById("startBtn");
      var statusText = document.getElementById("status");
      var downloadEl = document.getElementById("download");
      var uploadEl = document.getElementById("upload");
      var downloadBytesEl = document.getElementById("downloadBytes");
      var uploadBytesEl = document.getElementById("uploadBytes");
      var downloadUrl = "https://speed.cloudflare.com/__down";
      var uploadUrl = "https://speed.cloudflare.com/__up";
      var runId = 0;

      function showBandwidth(bytes, elapsedMs, valueEl, bytesEl) {
        if (!elapsedMs || !Number.isFinite(bytes) || bytes <= 0) {
          valueEl.textContent = "—";
          bytesEl.textContent = "约 — MB/s";
          return;
        }
        var mbps = bytes * 8 / (elapsedMs / 1000) / 1000000;
        valueEl.textContent = mbps.toFixed(2);
        bytesEl.textContent = "约 " + (mbps / 8).toFixed(2) + " MB/s";
      }

      function createUploadPayload(size) {
        var bytes = new Uint8Array(size);
        if (window.crypto && window.crypto.getRandomValues) {
          for (var offset = 0; offset < size; offset += 65536) {
            window.crypto.getRandomValues(bytes.subarray(offset, Math.min(offset + 65536, size)));
          }
        } else {
          for (var i = 0; i < size; i++) bytes[i] = Math.random() * 256;
        }
        return new Blob([bytes], { type: "application/octet-stream" });
      }

      // Runs bounded concurrent requests for a fixed time, counting transmitted bytes.
      function measure(direction, durationMs, streams, payloadSize, thisRun) {
        return new Promise(function (resolve, reject) {
          var active = true;
          var totalBytes = 0;
          var requests = [];
          var startTime = performance.now();
          var uploadPayload = direction === "upload" ? createUploadPayload(payloadSize) : null;
          var failures = 0;
          var timer = setTimeout(stop, durationMs);

          function stop() {
            if (!active) return;
            active = false;
            clearTimeout(timer);
            requests.forEach(function (xhr) {
              try { xhr.abort(); } catch (_) {}
            });
            resolve({ bytes: totalBytes, elapsedMs: performance.now() - startTime });
          }

          function startRequest(streamIndex) {
            if (!active || thisRun !== runId) return;
            var xhr = new XMLHttpRequest();
            requests[streamIndex] = xhr;
            var lastLoaded = 0;
            var url = direction === "download"
              ? downloadUrl + "?bytes=" + payloadSize + "&r=" + Math.random()
              : uploadUrl + "?r=" + Math.random();

            function addProgress(loaded) {
              if (!active || thisRun !== runId) return;
              var delta = loaded - lastLoaded;
              if (delta > 0) totalBytes += delta;
              lastLoaded = loaded;
            }

            xhr.onprogress = function (event) {
              if (direction === "download") addProgress(event.loaded);
            };
            if (direction === "upload") {
              xhr.upload.onprogress = function (event) { addProgress(event.loaded); };
            }
            xhr.onload = function () {
              if (!active || thisRun !== runId) return;
              if (xhr.status < 200 || xhr.status >= 300) {
                failures++;
                if (failures >= 3) {
                  active = false;
                  clearTimeout(timer);
                  requests.forEach(function (request) { try { request.abort(); } catch (_) {} });
                  reject(new Error("测速服务器返回 HTTP " + xhr.status));
                  return;
                }
              }
              startRequest(streamIndex);
            };
            xhr.onerror = xhr.ontimeout = function () {
              if (!active || thisRun !== runId) return;
              failures++;
              if (failures >= 3) {
                active = false;
                clearTimeout(timer);
                requests.forEach(function (request) { try { request.abort(); } catch (_) {} });
                reject(new Error("无法连接测速服务器，请检查网络或浏览器跨域限制。"));
                return;
              }
              setTimeout(function () { startRequest(streamIndex); }, 250);
            };

            try {
              if (direction === "download") xhr.responseType = "arraybuffer";
              xhr.timeout = 12000;
              xhr.open(direction === "download" ? "GET" : "POST", url, true);
              if (direction === "upload") xhr.send(uploadPayload);
              else xhr.send();
            } catch (error) {
              xhr.onerror();
            }
          }

          for (var i = 0; i < streams; i++) startRequest(i);
          // If this test was superseded or timed out, ensure its promise settles.
          if (thisRun !== runId) stop();
        });
      }

      startButton.addEventListener("click", async function () {
        var thisRun = ++runId;
        startButton.disabled = true;
        startButton.textContent = "测速进行中…";
        downloadEl.textContent = "—";
        uploadEl.textContent = "—";
        downloadBytesEl.textContent = "约 — MB/s";
        uploadBytesEl.textContent = "约 — MB/s";

        try {
          statusText.textContent = "正在测试下载速度（25 秒）…";
          var download = await measure("download", 25000, 4, 10000000, thisRun);
          if (thisRun !== runId) return;
          showBandwidth(download.bytes, download.elapsedMs, downloadEl, downloadBytesEl);

          statusText.textContent = "下载完成，正在测试上传速度（15 秒）…";
          var upload = await measure("upload", 15000, 2, 2000000, thisRun);
          if (thisRun !== runId) return;
          showBandwidth(upload.bytes, upload.elapsedMs, uploadEl, uploadBytesEl);
          statusText.textContent = "测速完成";
        } catch (error) {
          if (thisRun === runId) {
            statusText.textContent = error.message || "测速失败，请检查网络后重试。";
            console.error(error);
          }
        } finally {
          if (thisRun === runId) {
            startButton.disabled = false;
            startButton.textContent = "重新测速";
          }
        }
      });
    })();
  </script>
</body>
</html>

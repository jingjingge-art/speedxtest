<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a33">
  <title>网络测速（Cloudflare）</title>
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #f4f7ff;
      background: #0b1224;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 38px 16px;
      background: radial-gradient(ellipse at 50% 0, #1d3262 0, #0b1224 62%);
      text-align: center;
    }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 46px);
      border: 1px solid #ffffff1a;
      border-radius: 24px;
      background: #111b31ee;
      box-shadow: 0 24px 80px #0006;
    }
    .eyebrow { margin: 0 0 10px; color: #8ca9ff; font-size: .78rem; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    .intro { margin: 12px 0 26px; color: #aab6d0; line-height: 1.7; }
    #startBtn {
      min-width: 180px;
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #5b86ff, #7655ef);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 26px #526fff44;
      transition: transform .18s ease, filter .18s ease;
    }
    #startBtn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    #startBtn:disabled { cursor: wait; opacity: .7; }
    #status { min-height: 1.6em; margin: 18px 0 26px; color: #c1cbe0; }
    .results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .result {
      padding: 22px 12px;
      border: 1px solid #ffffff18;
      border-radius: 18px;
      background: linear-gradient(145deg, #1a2844, #141e34);
    }
    .result-label { display: block; margin-bottom: 12px; color: #b6c2da; }
    .result-value { color: #fff; font-size: clamp(2rem, 8vw, 3rem); font-variant-numeric: tabular-nums; font-weight: 750; }
    .result-unit { margin-left: 6px; color: #aab6d0; font-size: .95rem; }
    .conversion { display: block; margin-top: 8px; color: #93a2bf; font-size: .85rem; }
    .notice { margin: 22px 0 0; padding: 12px 14px; border: 1px solid #ffffff16; border-radius: 12px; color: #aab6d0; font-size: .82rem; line-height: 1.65; text-align: left; }
    .notice a { color: #9ab5ff; }
    @media (max-width: 480px) {
      body { padding: 18px 10px; }
      main { border-radius: 18px; }
      .results { gap: 10px; }
      .result { padding: 20px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">INTERNET SPEED TEST</p>
    <h1>网络测速</h1>
    <p class="intro">使用 Cloudflare 官方测速服务测量当前网络的下载和上传速度。</p>
    <button id="startBtn" type="button">开始测速</button>
    <div id="status" role="status" aria-live="polite">准备就绪</div>
    <section class="results" aria-label="测速结果">
      <article class="result">
        <span class="result-label">下载速度</span>
        <span id="download" class="result-value">—</span><span class="result-unit">Mbps</span>
        <span id="downloadBytes" class="conversion">约 — MB/s</span>
      </article>
      <article class="result">
        <span class="result-label">上传速度</span>
        <span id="upload" class="result-value">—</span><span class="result-unit">Mbps</span>
        <span id="uploadBytes" class="conversion">约 — MB/s</span>
      </article>
    </section>
    <p class="notice">
      本测试会向 Cloudflare 的测速网络发送下载和上传请求。根据 Cloudflare 官方说明，测试结果会被收集用于汇总分析。点击开始即表示你已知悉这一点。<br>
      <a href="https://github.com/cloudflare/speedtest" target="_blank" rel="noopener noreferrer">查看 Cloudflare Speedtest 说明</a>
    </p>
  </main>

  <script>
    (function () {
      var startButton = document.getElementById("startBtn");
      var statusText = document.getElementById("status");
      var downloadEl = document.getElementById("download");
      var uploadEl = document.getElementById("upload");
      var downloadBytesEl = document.getElementById("downloadBytes");
      var uploadBytesEl = document.getElementById("uploadBytes");
      var running = false;

      function showBandwidth(bps, valueEl, bytesEl) {
        if (typeof bps !== "number" || !Number.isFinite(bps) || bps <= 0) {
          valueEl.textContent = "—";
          bytesEl.textContent = "约 — MB/s";
          return;
        }
        var mbps = bps / 1000000;
        valueEl.textContent = mbps.toFixed(2);
        bytesEl.textContent = "约 " + (mbps / 8).toFixed(2) + " MB/s";
      }

      function render(results) {
        showBandwidth(results.getDownloadBandwidth(), downloadEl, downloadBytesEl);
        showBandwidth(results.getUploadBandwidth(), uploadEl, uploadBytesEl);
      }

      startButton.addEventListener("click", async function () {
        if (running) return;
        running = true;
        startButton.disabled = true;
        startButton.textContent = "正在启动…";
        statusText.textContent = "正在连接 Cloudflare 测速网络…";
        downloadEl.textContent = "—";
        uploadEl.textContent = "—";
        downloadBytesEl.textContent = "约 — MB/s";
        uploadBytesEl.textContent = "约 — MB/s";

        try {
          // Cloudflare 官方示例使用的浏览器模块；测速数据通过其官方 SDK 采集。
          var module = await import("https://cdn.skypack.dev/@cloudflare/speedtest");
          var SpeedTest = module.default;
          var engine = new SpeedTest({ autoStart: false });

          engine.onResultsChange = function () {
            render(engine.results);
            statusText.textContent = "测速进行中…";
          };
          engine.onError = function (message, httpStatus) {
            console.warn("Cloudflare speed test error:", message, httpStatus);
            statusText.textContent = httpStatus
              ? "测速请求遇到问题（HTTP " + httpStatus + "），正在尝试继续…"
              : "测速请求遇到问题，正在尝试继续…";
          };
          engine.onFinish = function (results) {
            render(results);
            statusText.textContent = "测速完成";
            startButton.disabled = false;
            startButton.textContent = "重新测速";
            running = false;
          };

          startButton.textContent = "测速进行中…";
          statusText.textContent = "已连接，正在测量网络速度…";
          engine.play();
        } catch (error) {
          console.error(error);
          statusText.textContent = "无法加载 Cloudflare 测速组件，请检查网络后重试。";
          startButton.disabled = false;
          startButton.textContent = "重新测速";
          running = false;
        }
      });
    })();
  </script>
</body>
</html>

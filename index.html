<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网络测速</title>
  <script src="speedtest.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      color: #202124;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 32px 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px #18284818;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro { margin: 0 0 24px; color: #5f6368; }
    #startStopBtn {
      min-width: 150px;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #315efb;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #startStopBtn:disabled { cursor: wait; opacity: .7; }
    #startStopBtn.running { background: #d93025; }
    #status { min-height: 1.5em; margin: 18px 0; color: #5f6368; }
    .results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .result {
      padding: 22px 12px;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      background: #fafbff;
    }
    .label { display: block; margin-bottom: 10px; color: #5f6368; }
    .value { font-size: clamp(1.7rem, 6vw, 2.5rem); font-weight: 700; color: #315efb; }
    .unit { margin-left: 5px; color: #5f6368; font-size: .95rem; }
    .note { margin: 22px 0 0; color: #80868b; font-size: .85rem; }
    @media (max-width: 420px) {
      main { padding: 26px 16px; }
      .results { gap: 10px; }
      .result { padding: 18px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>网络测速</h1>
    <p class="intro">点击按钮测试当前网络的下载和上传速度</p>
    <button id="startStopBtn" type="button">开始测速</button>
    <div id="status" role="status" aria-live="polite">准备就绪</div>
    <section class="results" aria-label="测速结果">
      <div class="result">
        <span class="label">下载速度</span>
        <span id="dlResult" class="value">—</span><span class="unit">Mbps</span>
      </div>
      <div class="result">
        <span class="label">上传速度</span>
        <span id="ulResult" class="value">—</span><span class="unit">Mbps</span>
      </div>
    </section>
    <p class="note">测速结果仅显示在本页面，不保存到结果数据库。</p>
  </main>

  <script>
    (function () {
      var speedtest = new Speedtest();
      var button = document.getElementById("startStopBtn");
      var status = document.getElementById("status");
      var dlResult = document.getElementById("dlResult");
      var ulResult = document.getElementById("ulResult");
      var latestData = null;

      // 只测下载和上传；关闭 IP 查询及遥测，因此不需要 result.php 或数据库。
      speedtest.setParameter("test_order", "D_U");
      speedtest.setParameter("telemetry_level", "none");
      speedtest.setParameter("getIp_ispInfo", false);
      speedtest.setParameter("time_dl_max", 5);
      speedtest.setParameter("time_ul_max", 5);

      function showSpeed(value) {
        if (value === "Fail") return "失败";
        var number = Number(value);
        return value === "" || !Number.isFinite(number) ? "—" : number.toFixed(2);
      }

      function finish(aborted) {
        button.classList.remove("running");
        button.textContent = "重新测速";
        if (aborted) {
          status.textContent = "测速已取消";
          return;
        }
        if (latestData) {
          dlResult.textContent = showSpeed(latestData.dlStatus);
          ulResult.textContent = showSpeed(latestData.ulStatus);
        }
        status.textContent = "测速完成";
      }

      button.addEventListener("click", function () {
        if (speedtest.getState() === 3) {
          speedtest.abort();
          return;
        }

        latestData = null;
        dlResult.textContent = "—";
        ulResult.textContent = "—";
        button.classList.add("running");
        button.textContent = "取消测速";
        status.textContent = "正在准备测速…";

        speedtest.onupdate = function (data) {
          latestData = data;
          if (data.testState === 1) status.textContent = "正在测试下载速度…";
          else if (data.testState === 3) status.textContent = "正在测试上传速度…";
        };
        speedtest.onend = finish;

        try {
          speedtest.start();
        } catch (error) {
          button.classList.remove("running");
          button.textContent = "重新测速";
          status.textContent = "无法启动测速，请检查服务器测速接口是否可访问。";
          console.error(error);
        }
      });
    })();
  </script>
</body>
</html>
